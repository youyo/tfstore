name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false
          cache: true

      - name: Install gitleaks (version pinned in mise.toml)
        run: mise install gitleaks

      - name: Run gitleaks (git history scan)
        run: mise exec gitleaks -- gitleaks git . --no-banner --redact --verbose --exit-code 1
